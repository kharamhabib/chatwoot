version: '3.8'

x-base: &base
  build:
    context: .
    dockerfile: ./docker/Dockerfile
  env_file: .env
  volumes:
    - storage:/app/storage
  restart: always

services:
  rails:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - FORCE_SSL=${FORCE_SSL:-false}
      - DEFAULT_LOCALE=pt_BR
      - FRONTEND_URL=${SERVICE_FQDN_RAILS:-${SERVICE_URL_RAILS:-http://localhost:3000}}
      - INTERNAL_HOST_URL=http://rails:3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}
      - SECRET_KEY_BASE=${SERVICE_PASSWORD_64_SECRETKEYBASE}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CHATWOOT_HUB_URL=https://chatwoot.rockconect.cloud/#
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    post_start:
      - command: ['bundle', 'exec', 'rails', 'db:chatwoot_prepare']
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Accept: text/html' --header='X-Forwarded-Proto: https' http://127.0.0.1:3000/ || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024M

  sidekiq:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - FORCE_SSL=${FORCE_SSL:-false}
      - DEFAULT_LOCALE=pt_BR
      - FRONTEND_URL=${SERVICE_FQDN_RAILS:-${SERVICE_URL_RAILS:-http://localhost:3000}}
      - INTERNAL_HOST_URL=http://rails:3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}
      - SECRET_KEY_BASE=${SERVICE_PASSWORD_64_SECRETKEYBASE}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CHATWOOT_HUB_URL=https://chatwoot.rockconect.cloud/#
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep [s]idekiq || exit 1"]
      interval: 20s
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: ghcr.io/fazer-ai/postgres-16-pgvector:latest
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chatwoot_production}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - CHATWOOT_HUB_URL=https://chatwoot.rockconect.cloud/#
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 20s
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"${SERVICE_PASSWORD_REDIS}\""]
    volumes:
      - redis:/data
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -p 6379 -a $${REDIS_PASSWORD} ping"]
      interval: 20s
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  storage:
  postgres:
  redis:
